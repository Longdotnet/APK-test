name: Fetch Whisper Assets

on:
  push:
    paths:
      - '.github/workflows/fetch-whisper-assets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download whisper.cpp Linux binary
        run: |
          set -euxo pipefail
          curl -L --fail --retry 5 -o whisper-bin.tar.gz \
            https://github.com/ggml-org/whisper.cpp/releases/download/b5130/whisper-bin-ubuntu-x64.tar.gz
          mkdir -p bundle/whisper
          tar -xzf whisper-bin.tar.gz -C bundle/whisper

      - name: Download multilingual base model
        run: |
          set -euxo pipefail
          curl -L --fail --retry 5 -o bundle/ggml-base-q5_1.bin \
            https://github.com/w3xgroup/taskurio-models/releases/download/whisper-models-v1/ggml-base-q5_1.bin
          sha256sum bundle/ggml-base-q5_1.bin

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: whisper-linux-base-q5_1
          path: bundle
          retention-days: 1
          compression-level: 0
