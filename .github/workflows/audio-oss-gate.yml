name: audio-oss-gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audio-ingest:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build audio boundary
        run: dotnet build src/RobloxPiano.Audio/RobloxPiano.Audio.csproj -c Release

      - name: Run audio ingest regression harness
        run: dotnet run --project tests/RobloxPiano.AudioTests/RobloxPiano.AudioTests.csproj -c Release
