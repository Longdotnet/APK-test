name: audio-oss-gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audio-oss:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Prepare pinned Spotify Basic Pitch ONNX model
        shell: pwsh
        run: ./.github/scripts/prepare-basic-pitch-model.ps1

      - name: Build audio boundary
        run: dotnet build src/RobloxPiano.Audio/RobloxPiano.Audio.csproj -c Release

      - name: Verify pinned model embeds, extracts and infers without external tooling
        run: dotnet run --project tests/RobloxPiano.AudioBundleTests/RobloxPiano.AudioBundleTests.csproj -c Release

      - name: Run audio ingest, ONNX, decoder and arranger regression harness
        run: dotnet run --project tests/RobloxPiano.AudioTests/RobloxPiano.AudioTests.csproj -c Release

      - name: Verify generated MIDI persistence and production-import parity
        run: dotnet run --project tests/RobloxPiano.GeneratedMidiTests/RobloxPiano.GeneratedMidiTests.csproj -c Release

      - name: Run real-model Audio-to-Piano end-to-end harness
        run: dotnet run --project tests/RobloxPiano.AudioPipelineTests/RobloxPiano.AudioPipelineTests.csproj -c Release
