name: audio-oss-gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audio-oss:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Fetch pinned Spotify Basic Pitch ONNX model
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $modelDir = Join-Path $env:RUNNER_TEMP 'basic-pitch'
          New-Item -ItemType Directory -Force -Path $modelDir | Out-Null
          $modelPath = Join-Path $modelDir 'nmp.onnx'
          $url = 'https://raw.githubusercontent.com/spotify/basic-pitch/fa5997af0a8210982619003269994a1be25eddf3/basic_pitch/saved_models/icassp_2022/nmp.onnx'
          Invoke-WebRequest -Uri $url -OutFile $modelPath
          $blob = (git hash-object $modelPath).Trim()
          if ($blob -ne 'c30e5f9438e798604b7177aa26be1fe64482f767') {
            throw "Basic Pitch model provenance check failed. Expected git blob c30e5f9438e798604b7177aa26be1fe64482f767, got $blob."
          }
          if ((Get-Item $modelPath).Length -ne 230444) {
            throw "Basic Pitch model size check failed."
          }
          "BASIC_PITCH_MODEL_PATH=$modelPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build audio boundary
        run: dotnet build src/RobloxPiano.Audio/RobloxPiano.Audio.csproj -c Release

      - name: Run audio ingest and ONNX regression harness
        run: dotnet run --project tests/RobloxPiano.AudioTests/RobloxPiano.AudioTests.csproj -c Release
