name: Fetch Whisper Tiny Model

on:
  push:
    paths:
      - '.github/workflows/fetch-whisper-tiny.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download multilingual tiny model
        run: |
          set -euxo pipefail
          mkdir -p bundle
          curl -L --fail --retry 5 -o bundle/ggml-tiny-q5_1.bin \
            https://github.com/w3xgroup/taskurio-models/releases/download/whisper-models-v1/ggml-tiny-q5_1.bin
          sha256sum bundle/ggml-tiny-q5_1.bin

      - name: Upload model
        uses: actions/upload-artifact@v4
        with:
          name: whisper-tiny-q5_1
          path: bundle
          retention-days: 1
          compression-level: 0
