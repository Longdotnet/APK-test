name: production-release

on:
  workflow_run:
    workflows: ["production-gate"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout validated main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve immutable release version
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props -Raw
          $version = [string]$props.Project.PropertyGroup.VersionPrefix
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "VersionPrefix must be strict SemVer core (x.y.z), actual: '$version'"
          }
          $tag = "v$version"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "Release version: $tag"

      - name: Guard immutable release identity
        id: guard
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY *> $null
          $exists = ($LASTEXITCODE -eq 0)
          $global:LASTEXITCODE = 0
          if ($exists) {
            "publish=false" >> $env:GITHUB_OUTPUT
            "Release $env:TAG already exists. Immutable release preserved; bump VersionPrefix for the next client release."
          } else {
            "publish=true" >> $env:GITHUB_OUTPUT
          }

      - name: Build release candidate
        if: steps.guard.outputs.publish == 'true'
        shell: pwsh
        run: |
          dotnet build src/RobloxPiano.Core/RobloxPiano.Core.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "Core build failed" }
          dotnet run --project tests/RobloxPiano.RegressionTests/RobloxPiano.RegressionTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "Legacy regression harness failed" }
          dotnet run --project tests/RobloxPiano.TransportTests/RobloxPiano.TransportTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "Transport regression harness failed" }
          dotnet run --project tests/RobloxPiano.InputStateTests/RobloxPiano.InputStateTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "Held-input ownership regression harness failed" }
          dotnet run --project tests/RobloxPiano.ExpressiveTests/RobloxPiano.ExpressiveTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "Expressive sustain regression harness failed" }
          dotnet run --project tests/RobloxPiano.MidiTests/RobloxPiano.MidiTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "Deterministic MIDI importer regression harness failed" }
          dotnet run --project tests/RobloxPiano.MusicXmlTests/RobloxPiano.MusicXmlTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "Deterministic MusicXML importer regression harness failed" }
          dotnet run --project tests/RobloxPiano.MusicXmlRepeatTests/RobloxPiano.MusicXmlRepeatTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "MusicXML repeat normalization regression harness failed" }
          dotnet run --project tests/RobloxPiano.TimingTests/RobloxPiano.TimingTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "Timing calibration regression harness failed" }
          dotnet run --project tests/RobloxPiano.LibraryTests/RobloxPiano.LibraryTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "Song library regression harness failed" }
          dotnet run --project tests/RobloxPiano.DiscoveryTests/RobloxPiano.DiscoveryTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "Online discovery regression harness failed" }
          dotnet run --project tests/RobloxPiano.QualityTests/RobloxPiano.QualityTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "Playback quality harness failed" }

      - name: Publish client single EXE
        if: steps.guard.outputs.publish == 'true'
        shell: pwsh
        run: |
          dotnet publish src/RobloxPiano.App/RobloxPiano.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=embedded `
            -o artifacts/release
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed" }
          $files = @(Get-ChildItem artifacts/release -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'RobloxPiano.exe') {
            $names = ($files | ForEach-Object Name) -join ', '
            throw "Release contract failed. Expected only RobloxPiano.exe before checksum, found: $names"
          }

      - name: Validate published client identity and smoke test
        if: steps.guard.outputs.publish == 'true'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $exe = Resolve-Path artifacts/release/RobloxPiano.exe
          $productVersion = (Get-Item $exe).VersionInfo.ProductVersion
          if ([string]::IsNullOrWhiteSpace($productVersion) -or -not $productVersion.StartsWith($env:VERSION)) {
            throw "Published ProductVersion '$productVersion' does not match release version '$env:VERSION'."
          }
          & $exe --help
          if ($LASTEXITCODE -ne 0) { throw "Published executable smoke test failed" }
          & $exe --ui-smoke
          if ($LASTEXITCODE -ne 0) { throw "Published executable STA UI startup smoke test failed" }
          & $exe --input-abi-smoke
          if ($LASTEXITCODE -ne 0) { throw "Published executable Windows input compatibility smoke test failed" }

      - name: Generate checksum and release evidence
        if: steps.guard.outputs.publish == 'true'
        id: evidence
        shell: pwsh
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $hash = (Get-FileHash artifacts/release/RobloxPiano.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  RobloxPiano.exe" | Set-Content -NoNewline artifacts/release/RobloxPiano.exe.sha256
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          @"
          Roblox Piano $env:TAG

          Validated commit: $env:SHA
          Distribution: self-contained Windows x64 single executable
          Client dependencies: none required manually
          SHA256: $hash

          Client flow:
          1. Download RobloxPiano.exe and double-click it; the Sheet Library remains the normal starting point.
          2. Open Roblox, enter the target piano game, and select a playable Library song.
          3. On the first Play attempt for a Roblox process, the primary action becomes **Verify Input & Play** and opens the production Roblox input check.
          4. A successful observation confirms only that exact Roblox PID; subsequent songs can Play directly while the same process remains active.
          5. A blocked verdict changes the primary action to **Retest Input to Play** and playback cannot launch until the current Roblox process passes the check.
          6. Restarting or changing Roblox PID discards stale confirmation automatically and requires verification for the new process.

          Production capability and reliability in this release:
          - Process-scoped input readiness is now an enforced playback preflight instead of advisory diagnostics.
          - The Library exposes deterministic Open Roblox / Verify Input / Retest Input / Play states without AI or network dependency.
          - The Roblox target and readiness are resolved again after the input-check dialog and once more immediately before player launch so PID changes cannot reuse stale trust.
          - Unknown and blocked input states cannot silently launch playback; confirmed readiness allows direct playback for the same Roblox process.
          - The published executable input compatibility smoke covers no-target, unknown, confirmed, blocked and stale-confirmation/different-PID preflight decisions.
          - Existing GUI input diagnostics, PID focus boundary, release-all safety, multi-channel MIDI sustain, MIDI range auto-fit, MusicXML normalization, Legacy/Legacy x2, timing, pause/seek/cancellation and held-state safety remain unchanged.

          Notes:
          - Input confirmation remains intentionally in-memory and process-scoped. Closing Roblox or restarting the client requires verification again rather than persisting stale trust.
          - CI validates the deterministic Windows/input contract but cannot observe a live Roblox client consuming synthetic input; the GUI check still requires explicit human observation.
          - This release imports MIDI note data. It does not yet transcribe MP3/WAV/FLAC audio into notes or MIDI.
          - The executable is currently unsigned, so Windows SmartScreen may show a reputation warning.
          "@ | Set-Content artifacts/release/RELEASE_NOTES.md

      - name: Create GitHub Release
        if: steps.guard.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh release create $env:TAG `
            artifacts/release/RobloxPiano.exe `
            artifacts/release/RobloxPiano.exe.sha256 `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:SHA `
            --title "Roblox Piano v$env:VERSION" `
            --notes-file artifacts/release/RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release creation failed" }

      - name: Verify release is client-downloadable
        if: steps.guard.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          EXPECTED_HASH: ${{ steps.evidence.outputs.sha256 }}
        run: |
          New-Item -ItemType Directory -Force artifacts/download-check | Out-Null
          gh release download $env:TAG `
            --repo $env:GITHUB_REPOSITORY `
            --pattern RobloxPiano.exe `
            --dir artifacts/download-check
          if ($LASTEXITCODE -ne 0) { throw "Release asset download verification failed" }
          $downloaded = Get-FileHash artifacts/download-check/RobloxPiano.exe -Algorithm SHA256
          if ($downloaded.Hash.ToLowerInvariant() -ne $env:EXPECTED_HASH) {
            throw "Downloaded release asset hash does not match published candidate."
          }

      - name: Upload release provenance evidence
        if: steps.guard.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-provenance-${{ steps.version.outputs.tag }}
          path: |
            artifacts/release/RobloxPiano.exe.sha256
            artifacts/release/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 30
