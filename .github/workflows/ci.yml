name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches:
      - research/direct-follower-farm-simulator

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/FollowerFarmSimulator/FollowerFarmSimulator.csproj

      - name: Build
        run: dotnet build src/FollowerFarmSimulator/FollowerFarmSimulator.csproj --configuration Release --no-restore
