name: production-gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Show SDK
        run: dotnet --info

      - name: Validate release version contract
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props -Raw
          $version = [string]$props.Project.PropertyGroup.VersionPrefix
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "VersionPrefix must be strict SemVer core (x.y.z), actual: '$version'"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "Validated release version v$version"

      - name: Validate versioned release notes contract
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $notesPath = 'docs/releases/current-release.md'
          if (-not (Test-Path $notesPath)) {
            throw "Versioned release notes source is required: $notesPath"
          }

          $raw = Get-Content $notesPath -Raw
          $header = [regex]::Match($raw, '(?ms)\A---\r?\nschema:\s*1\r?\nversion:\s*(\d+\.\d+\.\d+)\r?\n---\r?\n')
          if (-not $header.Success) {
            throw 'Release notes must start with schema: 1 and strict SemVer version front matter.'
          }

          $declaredVersion = $header.Groups[1].Value
          if ($declaredVersion -ne $env:EXPECTED_VERSION) {
            throw "Release notes version '$declaredVersion' does not match VersionPrefix '$env:EXPECTED_VERSION'."
          }

          foreach ($token in @('{{VERSION}}', '{{COMMIT_SHA}}', '{{SHA256}}')) {
            $count = ([regex]::Matches($raw, [regex]::Escape($token))).Count
            if ($count -ne 1) {
              throw "Release notes token '$token' must appear exactly once; found $count."
            }
          }

          if ($raw -notmatch 'Sheet Library' -or $raw -notmatch 'Legacy x2' -or $raw -notmatch 'Support Bundle') {
            throw 'Release notes must retain the current client entrypoint, regression baseline, and support contract.'
          }

          "Validated versioned release notes for v$declaredVersion"

      - name: Build deterministic core
        run: dotnet build src/RobloxPiano.Core/RobloxPiano.Core.csproj -c Release

      - name: Run legacy regression harness
        run: dotnet run --project tests/RobloxPiano.RegressionTests/RobloxPiano.RegressionTests.csproj -c Release

      - name: Run transport regression harness
        run: dotnet run --project tests/RobloxPiano.TransportTests/RobloxPiano.TransportTests.csproj -c Release

      - name: Run held-input ownership regression harness
        run: dotnet run --project tests/RobloxPiano.InputStateTests/RobloxPiano.InputStateTests.csproj -c Release

      - name: Run expressive sustain regression harness
        run: dotnet run --project tests/RobloxPiano.ExpressiveTests/RobloxPiano.ExpressiveTests.csproj -c Release

      - name: Run deterministic MIDI importer regression harness
        run: dotnet run --project tests/RobloxPiano.MidiTests/RobloxPiano.MidiTests.csproj -c Release

      - name: Run deterministic MusicXML importer regression harness
        run: dotnet run --project tests/RobloxPiano.MusicXmlTests/RobloxPiano.MusicXmlTests.csproj -c Release

      - name: Run MusicXML repeat normalization regression harness
        run: dotnet run --project tests/RobloxPiano.MusicXmlRepeatTests/RobloxPiano.MusicXmlRepeatTests.csproj -c Release

      - name: Run timing calibration regression harness
        run: dotnet run --project tests/RobloxPiano.TimingTests/RobloxPiano.TimingTests.csproj -c Release

      - name: Run song library regression harness
        run: dotnet run --project tests/RobloxPiano.LibraryTests/RobloxPiano.LibraryTests.csproj -c Release

      - name: Run online discovery regression harness
        run: dotnet run --project tests/RobloxPiano.DiscoveryTests/RobloxPiano.DiscoveryTests.csproj -c Release

      - name: Run playback quality harness
        run: dotnet run --project tests/RobloxPiano.QualityTests/RobloxPiano.QualityTests.csproj -c Release

      - name: Build Windows client
        run: dotnet build src/RobloxPiano.App/RobloxPiano.App.csproj -c Release

      - name: Run desktop authorization recovery regression harness
        run: dotnet run --project tests/RobloxPiano.AppRecoveryTests/RobloxPiano.AppRecoveryTests.csproj -c Release

      - name: Publish self-contained single EXE
        shell: pwsh
        run: |
          dotnet publish src/RobloxPiano.App/RobloxPiano.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=embedded `
            -o artifacts/publish

          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed" }

          $files = @(Get-ChildItem artifacts/publish -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'RobloxPiano.exe') {
            $names = ($files | ForEach-Object Name) -join ', '
            throw "Distribution contract failed. Expected only RobloxPiano.exe, found: $names"
          }

      - name: Published EXE version contract
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $productVersion = (Get-Item artifacts/publish/RobloxPiano.exe).VersionInfo.ProductVersion
          if ([string]::IsNullOrWhiteSpace($productVersion) -or -not $productVersion.StartsWith($env:EXPECTED_VERSION)) {
            throw "Published ProductVersion '$productVersion' does not match VersionPrefix '$env:EXPECTED_VERSION'."
          }

      - name: Clean-machine style smoke test
        shell: pwsh
        run: |
          & ./artifacts/publish/RobloxPiano.exe --help
          if ($LASTEXITCODE -ne 0) { throw "Published executable smoke test failed" }

      - name: Published EXE STA UI startup smoke test
        shell: pwsh
        run: |
          & ./artifacts/publish/RobloxPiano.exe --ui-smoke
          if ($LASTEXITCODE -ne 0) { throw "Published executable STA UI startup smoke test failed" }

      - name: Published EXE Windows input ABI smoke test
        shell: pwsh
        run: |
          & ./artifacts/publish/RobloxPiano.exe --input-abi-smoke
          if ($LASTEXITCODE -ne 0) { throw "Published executable Windows INPUT ABI smoke test failed" }

      - name: Published EXE quality-report smoke test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/quality | Out-Null

          & ./artifacts/publish/RobloxPiano.exe `
            samples/smoke/quality-smoke.txt `
            --dry-run `
            --start-delay 0 `
            --quality-report artifacts/quality/smoke.json

          if ($LASTEXITCODE -ne 0) { throw "Published executable quality-report smoke test failed" }
          if (-not (Test-Path artifacts/quality/smoke.json)) { throw "Quality report was not created" }

          $report = Get-Content artifacts/quality/smoke.json -Raw | ConvertFrom-Json
          if ($report.schemaVersion -ne 1) { throw "Unexpected quality report schema: $($report.schemaVersion)" }
          if ($report.plannedEdgeCount -le 0) { throw "Quality report did not contain planned edges" }
          if ($report.dispatchedEdgeCount -ne $report.plannedEdgeCount) {
            throw "Published EXE missed edges in dry-run quality smoke test"
          }
          if ($report.failureCount -ne 0) { throw "Published EXE reported quality failures" }

      - name: Malformed baseline is a controlled client error
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false

          Set-Content -Path artifacts/quality/invalid-baseline.json -Value '{broken-json'
          & ./artifacts/publish/RobloxPiano.exe `
            samples/smoke/quality-smoke.txt `
            --dry-run `
            --start-delay 0 `
            --baseline-report artifacts/quality/invalid-baseline.json

          $appExitCode = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          if ($appExitCode -ne 1) {
            throw "Malformed baseline must return controlled exit code 1, actual: $appExitCode"
          }

      - name: Upload client artifact
        uses: actions/upload-artifact@v4
        with:
          name: RobloxPiano-win-x64
          path: artifacts/publish/RobloxPiano.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload CI quality evidence
        uses: actions/upload-artifact@v4
        with:
          name: playback-quality-evidence
          path: artifacts/quality/smoke.json
          if-no-files-found: error
          retention-days: 14
